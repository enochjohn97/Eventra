<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | EventOut Client</title>
    <link rel="stylesheet" href="../css/client-style.css">
    <link rel="stylesheet" href="/public/assets/brand/sidebar-logo.css">
    <link rel="stylesheet" href="../../public/css/modals.css">
    <link rel="stylesheet" href="../css/modal-styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="../../public/js/storage.js"></script>
    <script src="../../public/js/utils.js"></script>
    <script src="../../public/js/auth-controller.js"></script>
    <script src="../../public/js/auth-guard.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico" />
    <link rel="apple-touch-icon" href="/public/assets/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="../../public/css/pagination.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo" aria-label="EventOut">
            <img src="/public/assets/brand/logo-wordmark-white.svg" alt="EventOut" class="logo-wordmark" />
            <img src="/public/assets/brand/logo-mark-only.svg" alt="EventOut" class="logo-mark-only" />
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item">
                <a href="/client/dashboard.html">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="/client/events.html">
                    <i data-lucide="calendar"></i>
                    <span>Events</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="/client/tickets.html">
                    <i data-lucide="ticket"></i>
                    <span>Tickets</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="/client/payments.html">
                    <i data-lucide="credit-card"></i>
                    <span>Payments</span>
                </a>
            </li>
            <li class="menu-item active">
                <a href="/client/users.html">
                    <i data-lucide="users"></i>
                    <span>Users</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="/client/media.html">
                    <i data-lucide="folder-closed"></i>
                    <span>Media</span>
                </a>
            </li>
        </ul>
    </aside>

    <div class="main-layout">
        <!-- Header -->
        <header class="header">
            <div class="header-search">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" placeholder="Search">
            </div>
            <div class="header-actions">
                <button id="globalExportBtn" class="action-icon" title="Export data" aria-label="Export data">
                    <i data-lucide="download"></i>
                </button>
                <div class="action-icon" data-drawer="notifications">
                    <i data-lucide="bell"></i>
                </div>
                <div class="user-profile">
                    <div class="user-avatar" style="background: var(--grad-indigo);"></div>
                </div>
            </div>
        </header>

        <main class="content-area">
            <div class="page-header">
                <h1 style="font-size: 1.5rem; font-weight: 800;">Users</h1>
            </div>

            <div class="client-stats-grid">
                <div class="client-stat-card green">
                    <div class="stat-header">
                        <span class="stat-title">User Active</span>
                        <i data-lucide="user-check" class="stat-icon icon-green"></i>
                    </div>
                    <div class="stat-main-value" id="statActive">0</div>
                </div>
                <div class="client-stat-card blue">
                    <div class="stat-header">
                        <span class="stat-title">User Engaged</span>
                        <i data-lucide="activity" class="stat-icon icon-blue"></i>
                    </div>
                    <div class="stat-main-value" id="statEngaged">0</div>
                </div>
                <div class="client-stat-card purple">
                    <div class="stat-header">
                        <span class="stat-title">User Registered</span>
                        <i data-lucide="users" class="stat-icon icon-purple"></i>
                    </div>
                    <div class="stat-main-value" id="statRegistered">0</div>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="font-size: 1.1rem; margin: 0;">All Users</h3>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" id="selectAll"></th>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>State</th>
                            <th>Organiser</th>
                            <th>Status</th>
                            <th>Country</th>
                            <th>City</th>
                            <th>Date of Birth</th>
                            <th>Gender</th>
                            <th>Date Joined</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Users will be populated dynamically when they log in -->
                    </tbody>
                </table>
                <div id="paginationContainer"></div>
            </div>
        </main>
    </div>

    <!-- Export Modal -->
    <div class="modal-backdrop" id="exportModal">
        <div class="modal-content" style="max-width: 400px; padding: 2rem; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 9999;">
            <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem; font-weight: 700; color: #1e293b;">Export Options</h2>
            <ul class="export-options" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px;">
                <li class="export-option" data-format="CSV" style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 1rem; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; color: #3b82f6; transition: all 0.2s;" onmouseover="this.style.background='#eff6ff'; this.style.borderColor='#3b82f6'" onmouseout="this.style.background='#f8fafc'; this.style.borderColor='#e2e8f0'">
                    <i data-lucide="file-text"></i> CSV Spreadsheet
                </li>
            </ul>
        </div>
    </div>

    
    <script src="../js/state-manager.js"></script>
    <script src="../js/drawer-system.js"></script>
    <script src="../js/export-manager.js"></script>
    <script src="../js/notification-system.js"></script>
    <script src="../js/search-manager.js"></script>
    <script src="../js/paystack-banks.js"></script>
    <script src="../js/modals.js"></script>
    <script src="../js/users.js"></script>
    <script src="../../public/js/pagination.js"></script>
    <script src="../js/client-main.js"></script>
    <script src="../../public/js/heartbeat.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        // Auto-refresh every 60 seconds when tab is visible
        setInterval(function() { if (document.visibilityState === 'visible') location.reload(); }, 60000);
    </script>
</body>
</html>
