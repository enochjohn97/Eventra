<!-- Eventra Support Chat Widget -->
<link rel="stylesheet" href="/public/css/chat.css">

<div id="chat-launcher" onclick="window.EventraChat.toggle()">
    <i class="fas fa-comment-dots"></i>
    <span class="badge" id="chat-unread-badge" style="display: none;">0</span>
</div>

<div id="eventra-chat-widget">
    <div class="chat-header">
        <div class="chat-header-info">
            <span class="chat-header-title">Support Chat</span>
            <span class="chat-header-status" id="chat-status-text">Connecting...</span>
        </div>
        <button class="chat-close-btn" onclick="window.EventraChat.toggle()">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <div class="chat-body" id="chat-body">
        <!-- Messages will be injected here -->
        
        <div class="typing-indicator" id="chat-typing-indicator">
            <span></span><span></span><span></span>
        </div>
    </div>
    
    <div class="chat-footer">
        <input type="file" id="chat-file-input" style="display: none;" onchange="window.EventraChat.uploadFile(this)">
        <button class="chat-btn attachment-btn" onclick="document.getElementById('chat-file-input').click()">
            <i class="fas fa-paperclip"></i>
        </button>
        <input type="text" class="chat-input" id="chat-input-field" placeholder="Type a message..." onkeypress="window.EventraChat.handleKeyPress(event)" oninput="window.EventraChat.handleTyping()">
        <button class="chat-btn" onclick="window.EventraChat.sendMessage()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<script src="/public/js/chat.js"></script>
