<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login to your Eventra account to manage and discover experiences" />
    <title>Admin Login · Eventra</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0b0b12;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 1rem;
        }

        /* ── main container ── */
        .login-container {
            display: flex;
            width: 100%;
            max-width: 1280px;
            min-height: 92vh;
            max-height: 96vh;
            background: radial-gradient(circle at 15% 25%, rgba(124, 58, 237, 0.10) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(167, 139, 250, 0.10) 0%, transparent 45%),
                #11111a;
            border-radius: 32px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        /* ── brand mark (top-left) ── */
        .brand-mark {
            position: absolute;
            top: 28px;
            left: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
            color: #fff;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-decoration: none;
            pointer-events: none;
            user-select: none;
        }
        .brand-mark img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #7c3aed;
            box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.3);
        }
        .brand-mark span {
            background: linear-gradient(135deg, #f0f0ff 0%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── left: login form ── */
        .login-left {
            flex: 0 0 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 2.5rem 2.5rem 3.5rem;
            z-index: 10;
        }

        .login-form-container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 2.8rem 2.8rem 3.2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            transition: box-shadow 0.4s ease;
        }
        .login-form-container:hover {
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.6);
        }

        .login-header {
            margin-bottom: 2.2rem;
        }
        .login-title {
            font-size: 2rem;
            font-weight: 800;
            color: #f0f0ff;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .login-subtitle {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
            margin-top: 0.4rem;
            font-weight: 500;
        }
        .login-subtitle a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .login-subtitle a:hover {
            color: #c4b5fd;
        }

        /* ── form elements ── */
        .form-group {
            margin-bottom: 1.4rem;
        }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 0.4rem;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }
        .input-wrapper:focus-within {
            border-color: rgba(124, 58, 237, 0.5);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }
        .input-wrapper .form-input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.95rem;
            font-weight: 500;
            color: #f0f0ff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.01em;
        }
        .input-wrapper .form-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
            letter-spacing: 0.02em;
        }
        .input-wrapper .form-input:read-only {
            cursor: default;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.25);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 4px;
        }
        .toggle-password:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .error-message {
            font-size: 0.75rem;
            color: #f87171;
            margin-top: 0.3rem;
            min-height: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        /* ── options row ── */
        .form-options {
            display: flex;
            justify-content: flex-end;
            margin: 0.2rem 0 1.8rem;
        }
        .forgot-password {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
            letter-spacing: 0.01em;
        }
        .forgot-password:hover {
            color: #a78bfa;
        }

        /* ── login button ── */
        .login-button {
            width: 100%;
            padding: 0.9rem 1.5rem;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s, background 0.3s;
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.30);
            position: relative;
            overflow: hidden;
        }
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(124, 58, 237, 0.45);
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }
        .login-button:active {
            transform: translateY(0px) scale(0.98);
        }
        .login-button .btn-shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.10), transparent);
            transform: skewX(-20deg);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        /* ── proudly nigerian ── */
        .footer-note {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 1.2rem;
        }
        .footer-note span {
            color: rgba(255, 255, 255, 0.25);
        }
        .footer-note .flag {
            display: inline-block;
            margin: 0 4px;
        }

        /* ── right: slider ── */
        .login-right {
            flex: 0 0 50%;
            display: flex !important;
            align-items: center;
            justify-content: center;
            padding: 2rem 2.5rem 2rem 1.5rem;
            z-index: 5;
        }

        .slider-images {
            position: relative;
            width: 100%;
            max-width: 560px;
            aspect-ratio: 4 / 5;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.55);
            background: #0b0b12;
        }

        .slider-images .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(1.04);
            transition: opacity 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform, opacity;
            border-radius: 24px;
        }
        .slider-images .slide.active {
            opacity: 1;
            transform: scale(1);
            z-index: 2;
        }
        .slider-images .slide.exit {
            opacity: 0;
            transform: scale(1.04);
            z-index: 1;
        }

        /* slider overlay gradient for readability */
        .slider-images::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(11, 11, 18, 0.20) 0%, transparent 50%, rgba(11, 11, 18, 0.10) 100%);
            z-index: 3;
            pointer-events: none;
            border-radius: 24px;
        }

        /* slider dots indicator */
        .slider-dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .slider-dots .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.4s, transform 0.3s;
            cursor: pointer;
            border: none;
            padding: 0;
        }
        .slider-dots .dot.active {
            background: #a78bfa;
            transform: scale(1.25);
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.4);
        }
        .slider-dots .dot:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* ── responsive ── */
        @media (max-width: 1024px) {
            .login-container {
                flex-direction: column;
                max-height: none;
                min-height: auto;
                border-radius: 24px;
                padding: 1.5rem;
            }
            .login-left {
                flex: 1 1 auto;
                padding: 2rem 1.5rem;
                width: 100%;
                order: 1;
            }
            .login-right {
                flex: 1 1 auto;
                padding: 0.5rem 0 1rem;
                width: 100%;
                order: 0;
            }
            .slider-images {
                max-width: 100%;
                aspect-ratio: 16 / 9;
                max-height: 260px;
            }
            .login-form-container {
                max-width: 100%;
                padding: 2rem 1.5rem;
            }
            .brand-mark {
                top: 18px;
                left: 22px;
                font-size: 1.1rem;
            }
            .brand-mark img {
                width: 32px;
                height: 32px;
            }
            .login-title {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 0.75rem;
                border-radius: 18px;
            }
            .login-left {
                padding: 1.2rem 0.8rem;
            }
            .login-form-container {
                padding: 1.5rem 1rem;
                border-radius: 20px;
            }
            .login-title {
                font-size: 1.35rem;
            }
            .brand-mark {
                top: 12px;
                left: 14px;
                font-size: 0.95rem;
            }
            .brand-mark img {
                width: 28px;
                height: 28px;
            }
            .slider-images {
                max-height: 180px;
                border-radius: 16px;
            }
            .slider-dots {
                bottom: 10px;
                padding: 4px 12px;
                gap: 6px;
            }
            .slider-dots .dot {
                width: 6px;
                height: 6px;
            }
            .input-wrapper .form-input {
                font-size: 0.85rem;
                padding: 0.7rem 0.8rem 0.7rem 2.4rem;
            }
            .input-icon {
                left: 10px;
            }
            .login-button {
                font-size: 0.9rem;
                padding: 0.75rem;
            }
            .footer-note {
                font-size: 0.6rem;
                margin-top: 1.2rem;
                padding-top: 0.8rem;
            }
        }

        /* ── utilities ── */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* ── subtle pulse on brand mark ── */
        @keyframes brandPulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }
        .brand-mark img {
            animation: brandPulse 4s ease-in-out infinite;
        }

        /* ── form input autofill override ── */
        .input-wrapper .form-input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px rgba(255, 255, 255, 0.04) inset !important;
            -webkit-text-fill-color: #f0f0ff !important;
            border-radius: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- ── Brand ── -->
        <div class="brand-mark">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='50' fill='%237c3aed'/%3E%3Cpath d='M30 30 L70 30 L70 50 L50 70 L30 50 Z' fill='%23f0f0ff' opacity='0.9'/%3E%3Ccircle cx='50' cy='50' r='12' fill='%237c3aed'/%3E%3C/svg%3E"
            alt="Eventra logo" />
            <span>Eventra</span>
        </div>

        <!-- ── LEFT: Login Form ── -->
        <div class="login-left">
            <div class="login-form-container">

                <header class="login-header">
                    <h1 class="login-title">Welcome Back!</h1>
                    <p class="login-subtitle">
                        Don't have an account? <a href="#">Sign Up</a>
                    </p>
                </header>

                <form id="loginForm" class="login-form" autocomplete="off" novalidate>

                    <!-- Username -->
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <i data-lucide="user" style="width:18px;height:18px;"></i>
                            </span>
                            <input type="text" id="username" name="username" class="form-input"
                            placeholder="Enter your username"
                            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                            data-lpignore="true" readonly required />
                        </div>
                        <div id="usernameError" class="error-message"></div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            </span>
                            <input type="password" id="password" name="password" class="form-input"
                            placeholder="••••••••"
                            autocomplete="new-password" data-lpignore="true" readonly required />
                            <button type="button" id="togglePassword" class="toggle-password" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <div id="passwordError" class="error-message"></div>
                    </div>

                    <!-- Forgot Password -->
                    <div class="form-options">
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" id="loginButton" class="login-button">
                        <span class="btn-shimmer"></span>
                        Login
                    </button>

                </form>

                <!-- Proudly Nigerian -->
                <div class="footer-note">
                    <span class="flag">🇳🇬</span>
                    <span>PROUDLY</span>
                    <span>NIGERIAN</span>
                    <span class="flag">🇳🇬</span>
                </div>

            </div>
        </div>

        <!-- ── RIGHT: Image Slider ── -->
        <div class="login-right">
            <div class="slider-images" id="sliderImages" role="img" aria-label="Eventra experiences slideshow">

                <!-- slides injected by JS -->
                <div id="slideContainer"></div>

                <!-- dots -->
                <div class="slider-dots" id="sliderDots"></div>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ─── Image pool (high-quality event/venue photos) ───
            const IMAGES = [];

            // ─── state ───
            let currentIndex = 0;
            let intervalId = null;
            const slideContainer = document.getElementById('slideContainer');
            const dotsContainer = document.getElementById('sliderDots');

            // ─── build slides & dots ───
            function buildSlider() {
                slideContainer.innerHTML = '';
                dotsContainer.innerHTML = '';

                IMAGES.forEach((src, i) => {
                    // slide
                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = `Eventra experience ${i + 1}`;
                    img.className = 'slide' + (i === 0 ? ' active' : '');
                    img.dataset.index = i;
                    img.loading = 'lazy';
                    slideContainer.appendChild(img);

                    // dot
                    const dot = document.createElement('button');
                    dot.className = 'dot' + (i === 0 ? ' active' : '');
                    dot.dataset.index = i;
                    dot.setAttribute('aria-label', `Go to slide ${i + 1}`);
                    dot.addEventListener('click', function() {
                        goTo(parseInt(this.dataset.index));
                    });
                    dotsContainer.appendChild(dot);
                });
            }

            // ─── navigate to slide ───
            function goTo(index) {
                if (index === currentIndex) return;
                const slides = slideContainer.querySelectorAll('.slide');
                const dots = dotsContainer.querySelectorAll('.dot');
                const total = slides.length;
                const clamped = ((index % total) + total) % total;

                // remove active from current
                slides[currentIndex].classList.remove('active');
                dots[currentIndex].classList.remove('active');

                // set new active
                slides[clamped].classList.add('active');
                dots[clamped].classList.add('active');

                currentIndex = clamped;
            }

            // ─── random next ───
            function nextRandom() {
                const total = IMAGES.length;
                let next;
                do {
                    next = Math.floor(Math.random() * total);
                } while (next === currentIndex && total > 1);
                goTo(next);
            }

            // ─── start / stop auto-play ───
            function startAutoPlay() {
                if (intervalId) clearInterval(intervalId);
                // change every 4–6 seconds (randomized)
                const delay = 4000 + Math.floor(Math.random() * 2500);
                intervalId = setInterval(() => {
                    nextRandom();
                }, delay);
            }

            function stopAutoPlay() {
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
            }

            // ─── reset timer on user interaction ───
            function resetAutoPlay() {
                stopAutoPlay();
                startAutoPlay();
            }

            // ─── init ───
            function init() {
                return;

                buildSlider();

                // click on dots resets timer
                dotsContainer.addEventListener('click', (e) => {
                    const dot = e.target.closest('.dot');
                    if (dot) resetAutoPlay();
                });

                // keyboard navigation
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        goTo(currentIndex - 1);
                        resetAutoPlay();
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        goTo(currentIndex + 1);
                        resetAutoPlay();
                    }
                });

                // touch / swipe support (simple)
                let touchStartX = 0;
                const sliderEl = document.getElementById('sliderImages');
                sliderEl.addEventListener('touchstart', (e) => {
                    touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });
                sliderEl.addEventListener('touchend', (e) => {
                    const diff = touchStartX - e.changedTouches[0].screenX;
                    if (Math.abs(diff) > 40) {
                        if (diff > 0) {
                            goTo(currentIndex + 1);
                        } else {
                            goTo(currentIndex - 1);
                        }
                        resetAutoPlay();
                    }
                }, { passive: true });

                // start auto-play
                startAutoPlay();

                // pause on hover
                sliderEl.addEventListener('mouseenter', stopAutoPlay);
                sliderEl.addEventListener('mouseleave', startAutoPlay);

                // also pause when interacting with form
                const form = document.getElementById('loginForm');
                form.addEventListener('focusin', stopAutoPlay);
                form.addEventListener('focusout', startAutoPlay);

                // ─── login form handling ───
                const loginButton = document.getElementById('loginButton');
                const emailInput = document.getElementById('email');
                const passwordInput = document.getElementById('password');
                const emailError = document.getElementById('emailError');
                const passwordError = document.getElementById('passwordError');

                // remove readonly on focus so user can type
                [emailInput, passwordInput].forEach(inp => {
                    inp.addEventListener('focus', function() {
                        this.removeAttribute('readonly');
                    });
                    inp.addEventListener('blur', function() {
                        if (!this.value) {
                            this.setAttribute('readonly', 'readonly');
                        }
                    });
                });

                loginButton.addEventListener('click', function(e) {
                    e.preventDefault();
                    let valid = true;
                    emailError.textContent = '';
                    passwordError.textContent = '';

                    const email = emailInput.value.trim();
                    const password = passwordInput.value.trim();

                    if (!email) {
                        emailError.textContent = 'Email is required';
                        valid = false;
                    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                        emailError.textContent = 'Please enter a valid email address';
                        valid = false;
                    }

                    if (!password) {
                        passwordError.textContent = 'Password is required';
                        valid = false;
                    } else if (password.length < 4) {
                        passwordError.textContent = 'Password must be at least 4 characters';
                        valid = false;
                    }

                    if (valid) {
                        // Simulate login
                        const btn = this;
                        const originalText = btn.textContent;
                        btn.textContent = 'Logging in…';
                        btn.disabled = true;
                        btn.style.opacity = '0.7';

                        setTimeout(() => {
                            btn.textContent = '✓ Success!';
                            btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                            btn.style.boxShadow = '0 8px 24px rgba(16,185,129,0.4)';

                            // Reset after a moment (demo)
                            setTimeout(() => {
                                btn.textContent = originalText;
                                btn.disabled = false;
                                btn.style.opacity = '1';
                                btn.style.background = '';
                                btn.style.boxShadow = '';
                                // Show a sweet alert style notification
                                const msg = document.createElement('div');
                                msg.style.cssText =
                                    'margin-top:1rem;padding:0.8rem;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.2);border-radius:12px;color:#6ee7b7;font-weight:600;text-align:center;font-size:0.9rem;';
                                msg.textContent = '🎉 Welcome back, Admin!';
                                const existing = document.querySelector('.login-success-msg');
                                if (existing) existing.remove();
                                msg.className = 'login-success-msg';
                                document.querySelector('.login-form-container').appendChild(msg);
                                setTimeout(() => {
                                    if (msg.parentNode) msg.remove();
                                }, 4000);
                            }, 1200);
                        }, 1400);
                    }
                });

                // toggle password visibility
                const toggleBtn = document.getElementById('togglePassword');
                toggleBtn.addEventListener('click', function() {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    this.innerHTML = isPassword ?
                        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>' :
                        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
                });

                // Enter key submits
                form.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        loginButton.click();
                    }
                });
            }

            // ─── run when DOM ready ───
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
